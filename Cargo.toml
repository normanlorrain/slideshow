[package]
name = "magic-lantern"
version = "0.1.0"
edition = "2021"
description = "A presentation tool for kiosks, digital signage, slide shows."
license = "MIT"
readme = "README.md"
repository = "https://github.com/normanlorrain/magic-lantern"
homepage = "https://github.com/normanlorrain/magic-lantern"
authors = ["Norman Lorrain <normanlorrain@gmail.com>"]
keywords = ["slideshow", "kiosk", "digital-signage", "images"]
categories = ["multimedia", "command-line-utilities"]
exclude = [
    "tests/images/**",
    "tests/pdfs/**",
    "*.log",
]

# Sources live under rs/ (library + binary entrypoints).
[lib]
name = "magic_lantern"
path = "rs/src/lib.rs"

# Binary must stay named `magic-lantern` for: pkill -USR1 magic-lantern
[[bin]]
name = "magic-lantern"
path = "rs/src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Errors
thiserror = "2"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Random (slideshow weights / album shuffle)
rand = "0.8"
# Directory walk
walkdir = "2"
# Image load / scale (JPEG, PNG, BMP)
image = "0.25"
# EXIF orientation + DateTimeOriginal
kamadak-exif = "0.6"
# Temporary files for PDF page rasters
tempfile = "3"
# PDF → bitmap (in-process; needs libpdfium.so at runtime — see docs/build_rust.md)
pdfium-render = { version = "0.9", default-features = true }
# Display / events
sdl2 = { version = "0.37", default-features = true, features = ["unsafe_textures"] }
# Text overlays (system TTF rasterized to RGBA, then SDL textures)
fontdue = "0.9"
# SIGUSR1 reload (Unix)
signal-hook = "0.3"

[dev-dependencies]
# none beyond std for now

[[test]]
name = "phase5_validation"
path = "rs/tests/phase5_validation.rs"

# Optimized kiosk binary: smaller, faster, fewer panics that unwind.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Slightly faster rebuilds when iterating on release bugs.
[profile.release-with-debug]
inherits = "release"
strip = false
debug = true
panic = "unwind"
